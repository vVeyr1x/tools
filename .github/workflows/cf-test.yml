name: CF 测试（临时，可删）
on:
  workflow_dispatch:

  push:
    paths:
      - '.github/workflows/cf-test.yml'

permissions:
  contents: read

jobs:
  cftest:
    runs-on: ubuntu-latest

    timeout-minutes: 35

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          repository: edwardw223/Ireland-Property-Map
          token: ${{ secrets.MAIN_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright (chromium + 系统依赖)
        run: npx playwright install --with-deps chromium

      - name: 写入测试脚本
        run: echo "" | base64 -d > cf-test.js

      - name: 基线 - 直连（Azure IP）
        run: LABEL=direct node cf-test.js shell 2>&1 | tee out-direct.txt
        continue-on-error: true

      - name: 装 WARP 并连接（含完整诊断）
        run: |
          exec 2>&1 | tee out-warpinstall.txt
          ls -l /dev/net/tun || (sudo mkdir -p /dev/net && sudo mknod /dev/net/tun c 10 200 && sudo chmod 666 /dev/net/tun)
          ls -l /dev/net/tun || echo "STILL_NO_TUN"
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools || echo "wg-tools install failed"
          curl -fsSL -o /tmp/wgcf https://github.com/ViRb3/wgcf/releases/download/v2.3.0/wgcf_2.3.0_linux_amd64 || echo "wgcf download failed"
          chmod +x /tmp/wgcf
          cd /tmp
          /tmp/wgcf register --accept-tos || echo "wgcf register failed"
          /tmp/wgcf generate || echo "wgcf generate failed"
          sed -i '/^DNS/d' /tmp/wgcf-profile.conf 2>/dev/null || true
          echo "=== profile ==="; grep -v PrivateKey /tmp/wgcf-profile.conf
          sudo modprobe wireguard || echo "modprobe failed"
          sudo wg-quick up /tmp/wgcf-profile.conf || echo "wg-quick up failed"
          sleep 8
          echo "=== wg show ==="; sudo wg show || echo "wg show failed"
          echo "=== egress after warp ==="; curl -s --max-time 20 https://ipinfo.io/json || echo "curl ipinfo failed"
        continue-on-error: true

      - name: 测试 WARP 出口
        run: LABEL=warp node cf-test.js shell 2>&1 | tee out-warp.txt
        continue-on-error: true

      - name: 关闭 WARP（否则后面没网）
        run: |
          sudo wg-quick down /tmp/wgcf-profile.conf 2>&1 || echo "wg-quick down failed"
          sleep 3
          curl -s --max-time 20 https://ipinfo.io/json || echo "curl after down failed"
        continue-on-error: true

      - name: 装 usque（MASQUE 用户态）并起本地代理
        run: |
          exec 2>&1 | tee out-usque.txt
          ASSET=$(curl -s https://api.github.com/repos/Diniboy1123/usque/releases/latest | grep -o 'https://[^"]*linux_amd64\.zip' | head -1)
          echo "asset: $ASSET"
          mkdir -p /tmp/usque && cd /tmp/usque
          curl -fsSL -o usque.zip "$ASSET" || echo "usque download failed"
          unzip -o usque.zip >/dev/null 2>&1 || echo "unzip failed"
          chmod +x /tmp/usque/usque || true
          echo "=== connect --help ==="; /tmp/usque/usque connect --help 2>&1 | head -50
          /tmp/usque/usque register 2>&1 | tail -3 || echo "usque register failed"
          HELP=$(/tmp/usque/usque connect --help 2>&1)
          if echo "$HELP" | grep -q -- "--http-proxy-port"; then FLAG="--http-proxy-port 8080"; EXPORT="http://127.0.0.1:8080";
          elif echo "$HELP" | grep -q -- "--socks5-port"; then FLAG="--socks5-port 1080"; EXPORT="socks5://127.0.0.1:1080";
          else FLAG="--http-proxy-port 8080"; EXPORT=""; fi
          echo "$EXPORT" > /tmp/usque_proxy.txt
          echo "chosen flag: $FLAG  export: $EXPORT"
          nohup /tmp/usque/usque connect $FLAG > /tmp/usque.log 2>&1 &
          sleep 15
          echo "=== usque log ==="; tail -25 /tmp/usque.log
          echo "=== via proxy ==="; curl -s --max-time 20 -x "$EXPORT" https://ipinfo.io/json || echo "proxy curl failed"
        continue-on-error: true

      - name: 测试 usque 代理出口
        run: |
          echo "export: $(cat /tmp/usque_proxy.txt)"
          LABEL=usque PROXY="$(cat /tmp/usque_proxy.txt)" node cf-test.js shell 2>&1 | tee out-usquerun.txt
        continue-on-error: true

      - name: 汇总（写成注解，便于外部读取）
        if: always()
        run: |
          emit() {
            echo "::error::$1 $(tail -c 1500 "$2" 2>/dev/null | tr '\n' '|')"
          }
          emit CFTEST_direct    out-direct.txt
          emit CFTEST_warpinst  out-warpinstall.txt
          emit CFTEST_warp      out-warp.txt
          emit CFTEST_usque     out-usque.txt
          emit CFTEST_usquerun  out-usquerun.txt
