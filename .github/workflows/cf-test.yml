name: CF 测试（临时，可删）
# 出口实验台：GitHub runner 上用不同出口/浏览器模式访问 daft.ie 的 Cloudflare 挑战
on:
  workflow_dispatch:

  push:
    paths:
      - '.github/workflows/cf-test.yml'

permissions:
  contents: read

jobs:
  cftest:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          repository: edwardw223/Ireland-Property-Map
          token: ${{ secrets.MAIN_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright (chromium + 系统依赖)
        run: npx playwright install --with-deps chromium

      - name: 写入测试脚本
        run: echo "" | base64 -d > cf-test.js

      - name: 基线 - 直连（Azure IP）
        run: LABEL=direct node cf-test.js shell 2>&1 | tee out-direct.txt
        continue-on-error: true

      - name: 安装 WARP（wgcf + WireGuard）并连接
        id: warp
        run: |
          set -x
          ls -l /dev/net/tun || echo "NO /dev/net/tun"
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools
          curl -fsSL -o /tmp/wgcf https://github.com/ViRb3/wgcf/releases/download/v2.3.0/wgcf_2.3.0_linux_amd64
          chmod +x /tmp/wgcf
          cd /tmp
          /tmp/wgcf register --accept-tos -v || echo "register failed"
          /tmp/wgcf generate -v || echo "generate failed"
          sed -i '/^DNS/d' /tmp/wgcf-profile.conf || true
          echo "--- profile ---"; sed 's/PrivateKey.*/PrivateKey = <hidden>/' /tmp/wgcf-profile.conf
          sudo modprobe wireguard || echo "modprobe wireguard failed"
          sudo wg-quick up /tmp/wgcf-profile.conf || echo "wg-quick up failed"
          sleep 6
          sudo wg show || echo "wg show failed"
          echo "--- egress ---"
          curl -s --max-time 25 https://ipinfo.io/json || echo "curl ipinfo failed"
        continue-on-error: true

      - name: WARP 出口 - shell 模式
        run: LABEL=warp node cf-test.js shell 2>&1 | tee out-warp.txt
        continue-on-error: true

      - name: 汇总（写成注解，便于外部读取）
        if: always()
        run: |
          for m in direct warp; do
            echo "::error::CFTEST_$m $(grep -h -E '^(RESULT|EGRESS|FATAL)' out-$m.txt 2>/dev/null | tr '\n' ' ' | cut -c1-1500)"
          done
