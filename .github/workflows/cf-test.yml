name: CF 测试（临时，可删）
on:
  workflow_dispatch:

  push:
    paths:
      - '.github/workflows/cf-test.yml'

permissions:
  contents: read

jobs:
  cftest:
    runs-on: ubuntu-latest

    timeout-minutes: 35

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          repository: edwardw223/Ireland-Property-Map
          token: ${{ secrets.MAIN_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright (chromium + 系统依赖)
        run: npx playwright install --with-deps chromium

      - name: Install xvfb
        run: sudo apt-get install -y xvfb

      - name: 写入测试脚本
        run: echo "" | base64 -d > cf-test.js

      - name: 测试 direct - 直连（Azure IP，基线）
        run: LABEL=direct node cf-test.js shell 2>&1 | tee out-direct.txt
        continue-on-error: true

      - name: 测试 native - 有头 xvfb + 不加任何 UA/自动化参数
        run: LABEL=native xvfb-run -a node cf-test.js native 2>&1 | tee out-native.txt
        continue-on-error: true

      - name: 装 WARP（wgcf+WireGuard），缺 tun 就手动建
        run: |
          {
            set -x
            ls -l /dev/net/tun || echo "NO_TUN_DEVICE"
            sudo mkdir -p /dev/net || true
            sudo mknod /dev/net/tun c 10 200 2>/dev/null || echo "mknod tun skipped"
            sudo chmod 666 /dev/net/tun 2>/dev/null || echo "chmod tun skipped"
            ls -l /dev/net/tun || echo "STILL_NO_TUN"
            sudo apt-get update -qq
            sudo apt-get install -y -qq wireguard-tools || echo "wireguard-tools install failed"
            curl -fsSL -o /tmp/wgcf https://github.com/ViRb3/wgcf/releases/download/v2.3.0/wgcf_2.3.0_linux_amd64 || echo "wgcf download failed"
            chmod +x /tmp/wgcf
            cd /tmp
            /tmp/wgcf register --accept-tos 2>&1 | tail -5 || echo "wgcf register failed"
            /tmp/wgcf generate 2>&1 | tail -5 || echo "wgcf generate failed"
            sed -i '/^DNS/d' /tmp/wgcf-profile.conf 2>/dev/null || true
            sudo modprobe wireguard 2>&1 || echo "modprobe wireguard failed"
            sudo wg-quick up /tmp/wgcf-profile.conf 2>&1 || echo "wg-quick up failed"
            sleep 6
            sudo wg show 2>&1 || echo "wg show failed"
            echo "--- egress after warp ---"
            curl -s --max-time 25 https://ipinfo.io/json || echo "curl ipinfo failed"
          } 2>&1 | tee out-warpinstall.txt
        continue-on-error: true

      - name: 测试 warp - WARP 出口 + shell 模式
        run: LABEL=warp node cf-test.js shell 2>&1 | tee out-warp.txt
        continue-on-error: true

      - name: 装 usque（MASQUE，纯用户态，本地 http 代理 8080）
        run: |
          {
            set -x
            mkdir -p /tmp/usque && cd /tmp/usque
            curl -fsSL -o usque.zip https://github.com/Diniboy1123/usque/releases/download/v4.2.1/usque_4.2.1_linux_amd64.zip || echo "usque download failed"
            unzip -o usque.zip >/dev/null 2>&1 || echo "unzip failed"
            chmod +x /tmp/usque/usque || true
            /tmp/usque/usque --help 2>&1 | head -30
            /tmp/usque/usque connect --help 2>&1 | head -40
            /tmp/usque/usque register 2>&1 | tail -5 || echo "usque register failed"
            nohup /tmp/usque/usque connect --http-proxy-port 8080 > /tmp/usque.log 2>&1 &
            sleep 15
            echo "--- usque log ---"; tail -20 /tmp/usque.log
            echo "--- via http proxy ---"; curl -s --max-time 20 -x http://127.0.0.1:8080 https://ipinfo.io/json || echo "proxy curl failed"
          } 2>&1 | tee out-usque.txt
        continue-on-error: true

      - name: 测试 usque - 走本地代理
        run: LABEL=usque PROXY=http://127.0.0.1:8080 node cf-test.js shell 2>&1 | tee out-usquerun.txt
        continue-on-error: true

      - name: 汇总（写成注解，便于外部读取）
        if: always()
        run: |
          emit() {
            echo "::error::$1 $(grep -h -E '^(RESULT|EGRESS|UA|FATAL|NO_TUN|STILL_NO_TUN|tun|wg-quick|wg show|register|usque|http-proxy|listen|Error|error)' "$2" 2>/dev/null | tr '\n' '|' | cut -c1-1500)"
          }
          emit CFTEST_direct    out-direct.txt
          emit CFTEST_native    out-native.txt
          emit CFTEST_warp      out-warp.txt
          emit CFTEST_warpinst  out-warpinstall.txt
          emit CFTEST_usque     out-usque.txt
          emit CFTEST_usquerun  out-usquerun.txt
