name: CF 测试（临时，可删）
on:
  workflow_dispatch:

  push:
    paths:
      - '.github/workflows/cf-test.yml'

permissions:
  contents: read

jobs:
  cftest:
    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          repository: edwardw223/Ireland-Property-Map
          token: ${{ secrets.MAIN_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright (chromium + 系统依赖)
        run: npx playwright install --with-deps chromium

      - name: 写入测试脚本
        run: echo "" | base64 -d > bulk-test.js

      - name: 装 WARP 并连接
        run: |
          exec 2>&1 | tee out-warpinstall.txt
          ls -l /dev/net/tun || (sudo mkdir -p /dev/net && sudo mknod /dev/net/tun c 10 200 && sudo chmod 666 /dev/net/tun)
          ls -l /dev/net/tun || echo "STILL_NO_TUN"
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools || echo "wg-tools install failed"
          curl -fsSL -o /tmp/wgcf https://github.com/ViRb3/wgcf/releases/download/v2.3.0/wgcf_2.3.0_linux_amd64
          chmod +x /tmp/wgcf && cd /tmp
          /tmp/wgcf register --accept-tos || echo "wgcf register failed"
          /tmp/wgcf generate || echo "wgcf generate failed"
          sed -i '/^DNS/d' /tmp/wgcf-profile.conf || true
          sudo modprobe wireguard || echo "modprobe failed"
          sudo wg-quick up /tmp/wgcf-profile.conf || echo "wg-quick up failed"
          sleep 10
          echo "=== wg show ==="; sudo wg show || echo "wg show failed"
          echo "=== egress ==="; curl -s --max-time 20 https://ipinfo.io/json || echo "curl failed"
        continue-on-error: true

      - name: 批量抓取 12 页（WARP 出口）
        run: node bulk-test.js 2>&1 | tee out-bulk.txt
        continue-on-error: true

      - name: WARP 状态复查
        run: |
          sudo wg show 2>&1 || echo "wg show failed"
          curl -s --max-time 20 -o /dev/null -w "http_code=%{http_code} time=%{time_total}s\n" https://www.daft.ie/robots.txt || echo "curl failed"
        continue-on-error: true

      - name: 汇总（写成注解，便于外部读取）
        if: always()
        run: |
          echo "::error::CFBULK $(grep -h -E '^(PAGE|SUMMARY|EGRESS|FATAL)' out-bulk.txt 2>/dev/null | tr '\n' '|' | cut -c1-2400)"
          echo "::error::CFWARPSTAT $(tail -c 500 out-warpinstall.txt 2>/dev/null | tr '\n' '|')"
