name: 断点续写验证（临时，可删）—— dublin1 中断后重跑
on:
  workflow_dispatch:

  push:
    paths:
      - '.github/workflows/cf-test.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          repository: edwardw223/Ireland-Property-Map
          token: ${{ secrets.MAIN_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright (chromium + 系统依赖)
        run: npx playwright install --with-deps chromium

      - name: 建立 WARP 出口
        timeout-minutes: 10
        run: |
          sed -i 's/\r$//' scripts/ci-setup-warp.sh
          timeout 420 bash scripts/ci-setup-warp.sh 2>&1 | tee out-warp.txt

      - name: 测试 1 - 抓 dublin1，抓到 4 个区域就强制中止（模拟被杀）
        timeout-minutes: 15
        continue-on-error: true
        run: TEST_ABORT_AFTER=4 node scripts/scrape-daft.js dublin1 2>&1 | tee out-abort.txt

      - name: 测试 2 - 重跑 dublin1（应自动从断点续跑并完成）
        timeout-minutes: 35
        continue-on-error: true
        run: node scripts/scrape-daft.js dublin1 2>&1 | tee out-resume.txt

      - name: 提交数据（生产同款）
        timeout-minutes: 10
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A data/daft/sale
          for f in $(git diff --cached --name-only -- 'data/daft/sale/*.json'); do
            case "$f" in *_progress-*) continue ;; esac
            n=$(node -e "const a=require('./$f');console.log(Array.isArray(a)?a.length:1)" 2>/dev/null || echo 1)
            if [ "$n" = "0" ]; then echo "::error::$f 是空数组，放弃提交"; exit 1; fi
          done
          git diff --cached --quiet || git commit -m "Update Daft sale dublin1 (resume test)"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then echo "推送成功"; exit 0; fi
            sleep 5
          done
          echo "::warning::推送失败"

      - name: 把日志推到公开仓库的 logs 分支
        if: always()
        continue-on-error: true
        run: |
          rm -rf /tmp/lp && mkdir -p /tmp/lp && cd /tmp/lp
          git init -q
          git config user.name ci && git config user.email ci@local
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/vVeyr1x/tools.git"
          git fetch -q --depth=1 origin logs || true
          (git checkout -q -B logs FETCH_HEAD) 2>/dev/null || git checkout -q -B logs
          cp "$GITHUB_WORKSPACE"/out-*.txt . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/data/daft/sale/_progress-*.json . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/data/daft/sale/crawl-summary-sale-dublin1.json . 2>/dev/null || true
          git add -A
          git commit -q -m "logs $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push -q -f origin logs || echo "push logs failed"

      - name: 汇总（注解）
        if: always()
        run: |
          echo "::error::ABORT $(grep -h -aE '(断点|TEST_ABORT|Areas|Unique|✔|❌|⟳|💾)' out-abort.txt 2>/dev/null | tail -12 | tr '\n' '|' | cut -c1-1200)"
          echo "::error::RESUME $(grep -h -aE '(断点|⟳|↷|Areas|Pages crawled|Unique|✔|❌)' out-resume.txt 2>/dev/null | tail -14 | tr '\n' '|' | cut -c1-1500)"
          echo "::error::FILES $(ls -l data/daft/sale/ | tail -6 | tr '\n' '|')"
