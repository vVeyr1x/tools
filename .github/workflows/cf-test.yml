name: CF 测试（临时，可删）
# 实验：GitHub runner 上三种浏览器模式能否过 daft.ie 的 Cloudflare Managed Challenge
#   shell       = chrome-headless-shell（现有脚本用法）
#   newheadless = 完整 Chromium 的 --headless=new
#   headed      = 有头 Chromium（xvfb 虚拟显示）
on:
  workflow_dispatch:

  push:
    paths:
      - '.github/workflows/cf-test.yml'

permissions:
  contents: read

jobs:
  cftest:
    runs-on: ubuntu-latest

    timeout-minutes: 25

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          repository: edwardw223/Ireland-Property-Map
          token: ${{ secrets.MAIN_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright (chromium + 系统依赖)
        run: npx playwright install --with-deps chromium

      - name: Install xvfb
        run: sudo apt-get install -y xvfb

      - name: 写入测试脚本
        run: echo "" | base64 -d > cf-test.js

      - name: 测试 1 - chrome-headless-shell
        run: node cf-test.js shell 2>&1 | tee out-shell.txt
        continue-on-error: true

      - name: 测试 2 - 完整 Chromium headless=new
        run: node cf-test.js newheadless 2>&1 | tee out-newheadless.txt
        continue-on-error: true

      - name: 测试 3 - 有头 + xvfb
        run: xvfb-run -a node cf-test.js headed 2>&1 | tee out-headed.txt
        continue-on-error: true

      - name: 汇总（写成注解，便于外部读取）
        if: always()
        run: |
          for m in shell newheadless headed; do
            echo "::error::CFTEST_$m $(grep -h -E '^(RESULT|EGRESS|FATAL)' out-$m.txt 2>/dev/null | tr '\n' ' ' | cut -c1-1200)"
          done
