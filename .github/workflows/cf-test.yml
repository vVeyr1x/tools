name: CF 验证（临时，可删）—— WARP 配置随仓库带 + Dublin 组真实抓取
on:
  workflow_dispatch:

  push:
    paths:
      - '.github/workflows/cf-test.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    timeout-minutes: 110

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          repository: edwardw223/Ireland-Property-Map
          token: ${{ secrets.MAIN_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright (chromium + 系统依赖)
        run: npx playwright install --with-deps chromium

      - name: 建立 WARP 出口
        timeout-minutes: 10
        continue-on-error: true
        run: |
          sed -i 's/\r$//' scripts/ci-setup-warp.sh
          timeout 420 bash -x scripts/ci-setup-warp.sh 2>&1 | tee out-warp.txt

      - name: 端到端 - 真实脚本抓 rent dublin 组（186 个区域 / 约 230 页）
        run: node scripts/scrape-daft-rent.js dublin 2>&1 | tee out-crawl.txt
        timeout-minutes: 80

      - name: 提交数据（与生产同一套命令）
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/daft/rent
          git diff --cached --quiet || git commit -m "Update Daft Rent (WARP verify)"
          git pull --rebase --autostash origin main
          git push

      - name: 把日志推到公开仓库的 logs 分支（方便读取）
        if: always()
        continue-on-error: true
        run: |
          rm -rf /tmp/logpush && mkdir -p /tmp/logpush && cd /tmp/logpush
          git init -q
          git config user.name ci && git config user.email ci@local
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/vVeyr1x/tools.git"
          git fetch -q --depth=1 origin logs || true
          (git checkout -q -B logs FETCH_HEAD) 2>/dev/null || git checkout -q -B logs
          cp "$GITHUB_WORKSPACE"/out-*.txt . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/data/daft/rent/crawl-summary.json . 2>/dev/null || true
          git add -A
          git commit -q -m "logs $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push -q -f origin logs || echo "push logs failed"

      - name: 汇总（写成注解，便于外部读取）
        if: always()
        run: |
          echo "::error::CFWARP $(tail -c 1000 out-warp.txt 2>/dev/null | tr '\n' '|')"
          echo "::error::CFCRAWL $(grep -h -aE '^(Areas|Group|Pages crawled|Empty areas|Total listings|Duplicates removed|Unique properties|Elapsed|✔|📄|❌|ABORT|Cloudflare|Skip|Area Statistics)' out-crawl.txt 2>/dev/null | tr '\n' '|' | cut -c1-2000)"
          echo "::error::CFSUMMARY $(tail -c 700 data/daft/rent/crawl-summary.json 2>/dev/null | tr '\n' '|')"
