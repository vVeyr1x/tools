name: Daft 抓取（Rent - Dublin）

on:
  workflow_dispatch:

  schedule:
    - cron: "30 17 * * 2-6"

permissions:
  contents: write

concurrency:
  group: daft-dublin
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    timeout-minutes: 223

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          repository: edwardw223/Ireland-Property-Map
          token: ${{ secrets.MAIN_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        timeout-minutes: 6
        run: timeout -k 10 300 npm install --no-audit --no-fund

      - name: Install Playwright (chromium + 系统依赖)
        timeout-minutes: 10
        run: timeout -k 10 480 npx playwright install --with-deps chromium

      - name: 建立 WARP 出口（绕过 daft 对云端 ASN 的 Cloudflare 拦截）
        timeout-minutes: 10
        run: |
          sed -i 's/\r$//' scripts/ci-setup-warp.sh
          setsid timeout -k 10 400 bash scripts/ci-setup-warp.sh > /tmp/warp.log 2>&1 < /dev/null
          rc=$?
          tail -n 150 /tmp/warp.log
          cp /tmp/warp.log out-warp.txt 2>/dev/null || true
          exit $rc

      - name: 抓取 Rent - Dublin（第 1 轮）
        timeout-minutes: 63
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          echo "===== 第 1 轮 $(date -u +%FT%TZ) ====="
          node scripts/scrape-daft-rent.js dublin 2>&1 | tee -a out-crawl.txt
      - name: 抓取 Rent - Dublin（第 2 轮）
        if: always()
        timeout-minutes: 63
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if [ -f "${RUNNER_TEMP}/crawl-done-dublin" ]; then
            echo "整组已完成，跳过第 2 轮"
            exit 0
          fi
          echo "重建 WARP（若出口被 Cloudflare 挡，会自动换新身份/新出口 IP）"
          sed -i 's/\r$//' scripts/ci-setup-warp.sh
          if ! setsid timeout -k 10 400 bash scripts/ci-setup-warp.sh >> out-warp.txt 2>&1 < /dev/null; then
            echo "WARP 重建失败，跳过本轮"
            exit 0
          fi
          echo "===== 第 2 轮（从断点续跑）$(date -u +%FT%TZ) ====="
          sleep 20
          node scripts/scrape-daft-rent.js dublin 2>&1 | tee -a out-crawl.txt
      - name: 抓取 Rent - Dublin（第 3 轮）
        if: always()
        timeout-minutes: 63
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if [ -f "${RUNNER_TEMP}/crawl-done-dublin" ]; then
            echo "整组已完成，跳过第 3 轮"
            exit 0
          fi
          echo "重建 WARP（若出口被 Cloudflare 挡，会自动换新身份/新出口 IP）"
          sed -i 's/\r$//' scripts/ci-setup-warp.sh
          if ! setsid timeout -k 10 400 bash scripts/ci-setup-warp.sh >> out-warp.txt 2>&1 < /dev/null; then
            echo "WARP 重建失败，跳过本轮"
            exit 0
          fi
          echo "===== 第 3 轮（从断点续跑）$(date -u +%FT%TZ) ====="
          sleep 20
          node scripts/scrape-daft-rent.js dublin 2>&1 | tee -a out-crawl.txt

      - name: 保存断点（失败也要提交，便于重跑续抓）
        if: always()
        timeout-minutes: 10
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f data/daft/rent/_progress-*.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "没有断点需要提交"
            exit 0
          fi

          git commit -m "Progress checkpoint Rent - Dublin"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then echo "断点已提交"; exit 0; fi
            echo "断点推送第 ${i} 次失败，5 秒后重试"; sleep 5
          done
          echo "::warning::断点提交失败（不影响本次抓取结果）"

      - name: 提交数据
        if: always()
        timeout-minutes: 10
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A data/daft/rent

          # 空数据保护：任何分组 JSON 被清空就放弃提交（脚本已先做零结果保护，这是第二道防线）
          for f in $(git diff --cached --name-only -- 'data/daft/rent/*.json'); do
            case "$f" in *_progress-*) continue ;; esac
            n=$(node -e "const a=require('./$f');console.log(Array.isArray(a)?a.length:1)" 2>/dev/null || echo 1)
            if [ "$n" = "0" ]; then
              echo "::error::$f 是空数组，放弃提交"
              exit 1
            fi
          done

          git diff --cached --quiet || git commit -m "Update Daft rent Rent - Dublin"

          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then ok=1; break; fi
            echo "推送第 ${i} 次失败，5 秒后重试"; sleep 5
          done
          [ "$ok" = "1" ] || { echo "::error::推送失败"; exit 1; }

      - name: 收尾（日志推到 logs 分支，便于排查）
        if: always()
        continue-on-error: true
        run: |
          rm -rf /tmp/lp && mkdir -p /tmp/lp && cd /tmp/lp
          git init -q
          git config user.name ci && git config user.email ci@local
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/vVeyr1x/tools.git"
          git fetch -q --depth=1 origin logs || true
          (git checkout -q -B logs FETCH_HEAD) 2>/dev/null || git checkout -q -B logs
          cp "$GITHUB_WORKSPACE"/out-*.txt . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/data/daft/*/_progress-*.json . 2>/dev/null || true
          git add -A
          git commit -q -m "Rent - Dublin $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push -q -f origin logs || echo "push logs failed"
