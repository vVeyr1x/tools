name: Daft 抓取（Sale - West）

on:
  workflow_dispatch:

  schedule:
    - cron: "15 2 * * 3-6"

permissions:
  contents: read

concurrency:
  group: daft-west
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    timeout-minutes: 55

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          repository: edwardw223/Ireland-Property-Map
          token: ${{ secrets.MAIN_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright (chromium + 系统依赖)
        run: npx playwright install --with-deps chromium

      - name: 建立 WARP 出口（绕过 daft 对云端 ASN 的 Cloudflare 拦截）
        timeout-minutes: 10
        run: |
          sed -i 's/\r$//' scripts/ci-setup-warp.sh
          timeout 420 bash scripts/ci-setup-warp.sh

      - name: 抓取 Sale - West
        timeout-minutes: 40
        run: node scripts/scrape-daft.js west

      - name: 提交数据
        timeout-minutes: 10
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/daft/sale

          # 空数据保护：任何分组 JSON 被清空就放弃提交（脚本已先做零结果保护，这是第二道防线）
          for f in $(git diff --cached --name-only -- 'data/daft/sale/*.json'); do
            n=$(node -e "const a=require('./$f');console.log(Array.isArray(a)?a.length:1)" 2>/dev/null || echo 1)
            if [ "$n" = "0" ]; then
              echo "::error::$f 是空数组，放弃提交"
              exit 1
            fi
          done

          git diff --cached --quiet || git commit -m "Update Daft sale Sale - West"

          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then ok=1; break; fi
            echo "推送第 ${i} 次失败，5 秒后重试"; sleep 5
          done
          [ "$ok" = "1" ] || { echo "::error::推送失败"; exit 1; }
