name: 更新Daft Sale房源（cork区域）

on:
  workflow_dispatch:

  schedule:
    - cron: "45 19 * * 2-6"

permissions:
  contents: write

jobs:
  scrape:

    runs-on: ubuntu-latest

    # 兜底：任何步骤挂死也不会白烧 6 小时
    timeout-minutes: 105

    steps:

      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          repository: edwardw223/Ireland-Property-Map
          token: ${{ secrets.MAIN_REPO_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Scrape Sale Cork
        timeout-minutes: 90
        run: node scripts/scrape-daft.js cork

      - name: 建立 WARP 出口（绕过 daft 对云端 ASN 的 Cloudflare 拦截）
        run: |
          sed -i 's/\r$//' scripts/ci-setup-warp.sh
          timeout 420 bash scripts/ci-setup-warp.sh
        timeout-minutes: 10

      - name: Commit updated properties
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          git add data/daft/sale

          # 空数据保护：任何分组 JSON 被清空就放弃提交（脚本已先做零结果保护，这里是第二道防线）
          for f in $(git diff --cached --name-only -- 'data/daft/sale/*.json'); do
            n=$(node -e "const a=require('./$f');console.log(Array.isArray(a)?a.length:1)" 2>/dev/null || echo 1)
            if [ "$n" = "0" ]; then
              echo "::error::$f 是空数组，放弃提交"
              exit 1
            fi
          done
          
          git diff --cached --quiet || git commit -m "Update Daft Sale Cork"
          
          git pull --rebase --autostash origin main

          git push origin main
