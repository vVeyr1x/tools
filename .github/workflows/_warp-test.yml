name: WARP 自检（临时，用完即删）
on:
  workflow_dispatch:

  push:
    paths:
      - '.github/workflows/_warp-test.yml'

permissions:
  contents: read

jobs:
  warptest:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          repository: edwardw223/Ireland-Property-Map
          token: ${{ secrets.MAIN_REPO_TOKEN }}

      - name: 建立 WARP 出口（与正式 workflow 同一条命令）
        timeout-minutes: 10
        run: |
          sed -i 's/\r$//' scripts/ci-setup-warp.sh
          setsid timeout -k 10 400 bash scripts/ci-setup-warp.sh > /tmp/warp.log 2>&1 < /dev/null
          rc=$?
          tail -n 120 /tmp/warp.log
          exit $rc

      - name: 取一个 daft 页面验证（浏览器模式）
        timeout-minutes: 8
        run: |
          cat > /tmp/probe.js <<'EOF'
          const { chromium } = require("playwright");
          (async () => {
            const b = await chromium.launch({ headless: true, args: ["--no-sandbox","--disable-dev-shm-usage"] });
            const p = await b.newPage();
            const r = await p.goto("https://www.daft.ie/property-for-rent/dublin-1", { waitUntil: "domcontentloaded", timeout: 60000 });
            await p.waitForTimeout(3000);
            const n = await p.locator("#__NEXT_DATA__").count();
            let tp = null;
            if (n > 0) { const j = await p.$eval("#__NEXT_DATA__", e => JSON.parse(e.textContent)); tp = j.props?.pageProps?.paging?.totalPages ?? null; }
            console.log("PROBE " + JSON.stringify({ status: r.status(), next_data: n, total_pages: tp, title: (await p.title()).slice(0,30) }));
            await b.close();
          })().catch(e => { console.error("PROBE FATAL " + e.message); process.exit(1); });
          EOF
          npm install --no-save --no-package-lock playwright >/dev/null 2>&1 || true
          if [ -d node_modules/playwright ]; then npx --yes playwright install chromium >/dev/null 2>&1 || true; fi
          node /tmp/probe.js 2>&1 | tee -a /tmp/warp.log

      - name: 把日志推到 logs 分支
        if: always()
        continue-on-error: true
        run: |
          rm -rf /tmp/lp && mkdir -p /tmp/lp && cd /tmp/lp
          git init -q
          git config user.name ci && git config user.email ci@local
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/vVeyr1x/tools.git"
          git fetch -q --depth=1 origin logs || true
          (git checkout -q -B logs FETCH_HEAD) 2>/dev/null || git checkout -q -B logs
          cp /tmp/warp.log warp-test.log 2>/dev/null || true
          git add -A
          git commit -q -m "warp self-test $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push -q -f origin logs || echo "push failed"
